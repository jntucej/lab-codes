<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260"><rect width="640" height="260" fill="#fafbfc"/><text x="320" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b" font-family="Arial">Naive Bayes Classifier</text>
<rect x="20" y="60" width="130" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="85" y="87" text-anchor="middle" font-size="11" fill="#1e293b" font-family="Arial">New Instance X</text>
<line x1="150" y1="83" x2="185" y2="83" stroke="#475569" stroke-width="2"/>
<polygon points="190,83 183,79 183,87" fill="#475569"/>
<rect x="190" y="55" width="180" height="56" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="280" y="80" text-anchor="middle" font-size="10" fill="#1e293b" font-family="Arial">Bayes Theorem</text>
<text x="280" y="96" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">P(C|X) = P(X|C)·P(C) / P(X)</text>
<line x1="370" y1="83" x2="405" y2="83" stroke="#475569" stroke-width="2"/>
<polygon points="410,83 403,79 403,87" fill="#475569"/>
<rect x="410" y="55" width="160" height="56" rx="6" fill="#e9d5ff" stroke="#6b21a8" stroke-width="1.5"/>
<text x="490" y="78" text-anchor="middle" font-size="10" fill="#1e293b" font-family="Arial">Assume independence</text>
<text x="490" y="94" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">(Naive assumption)</text>
<line x1="490" y1="111" x2="490" y2="140" stroke="#475569" stroke-width="2"/>
<polygon points="490,145 486,138 494,138" fill="#475569"/>
<rect x="410" y="145" width="160" height="50" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="490" y="165" text-anchor="middle" font-size="10" fill="#166534" font-family="Arial">Pick max P(Ci|X)</text>
<text x="490" y="181" text-anchor="middle" font-size="9" fill="#166534" font-family="Arial">→ Class label</text>
<text x="490" y="230" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">Best for spam filtering: word features + independence</text>
</svg>