<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210"><rect width="680" height="210" fill="#fafbfc"/><text x="340" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b" font-family="Arial">Activation Functions</text>
<!-- Sigmoid -->
<text x="60" y="55" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial">Sigmoid</text>
<line x1="30" y1="130" x2="130" y2="130" stroke="#e2e8f0" stroke-width="1"/>
<line x1="30" y1="130" x2="30"  y2="40"  stroke="#e2e8f0" stroke-width="1"/>
<path d="M 30 110 Q 70 110 80 90 Q 90 70 130 70" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="100" y="145" font-size="9" fill="#64748b" text-anchor="middle" font-family="Arial">f(x)=1/(1+e⁻ˣ)  range (0,1)</text>
<!-- Tanh -->
<text x="240" y="55" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial">Tanh</text>
<line x1="210" y1="130" x2="310" y2="130" stroke="#e2e8f0" stroke-width="1"/>
<line x1="210" y1="130" x2="210"  y2="40"  stroke="#e2e8f0" stroke-width="1"/>
<path d="M 210 110 Q 260 110 270 90 Q 280 70 310 70" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<text x="280" y="145" font-size="9" fill="#64748b" text-anchor="middle" font-family="Arial">f(x)=(eˣ−e⁻ˣ)/(eˣ+e⁻ˣ)  range (−1,1)</text>
<!-- ReLU -->
<text x="420" y="55" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial">ReLU</text>
<line x1="390" y1="130" x2="490" y2="130" stroke="#e2e8f0" stroke-width="1"/>
<line x1="390" y1="130" x2="390"  y2="40"  stroke="#e2e8f0" stroke-width="1"/>
<path d="M 390 130 L 440 130 L 490 80" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="460" y="145" font-size="9" fill="#64748b" text-anchor="middle" font-family="Arial">f(x)=max(0,x)  range [0,∞)</text>
<!-- Softmax -->
<text x="560" y="55" font-size="11" font-weight="bold" fill="#1e293b" font-family="Arial">Softmax</text>
<text x="620" y="85" font-size="9" fill="#64748b" text-anchor="middle" font-family="Arial">Multi-class prob</text>
<text x="620" y="105" font-size="9" fill="#64748b" text-anchor="middle" font-family="Arial">sums to 1</text>
<text x="300" y="190" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial">Output layer → Sigmoid / Softmax   |   Hidden layers → ReLU / Tanh</text>
</svg>